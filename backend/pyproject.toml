[project]
name = "pitwall-backend"
version = "0.1.0"
description = "Pitwall backend: F1 live lap-time forecasting"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "polars>=1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "lightgbm>=4.3",
    "fastf1>=3.4",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "features", "models", "sim", "backtest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
